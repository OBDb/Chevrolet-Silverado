generations:
  - name: "First Generation (GMT800)"
    start_year: 1999
    end_year: 2007
    description: "The original Silverado replaced the long-running C/K pickup trucks as Chevrolet's full-size truck offering. Available in light-duty 1500, medium-duty 2500, and heavy-duty 3500 variants with various cab and bed configurations, it featured more modern styling and improved refinement compared to its predecessor. Engine options included V6 and several V8 choices, with the 5.3L V8 being particularly popular. The interior was more car-like than previous Chevrolet trucks, with improved ergonomics and comfort. This generation established the Silverado nameplate and set the foundation for it to become one of GM's most profitable and important model lines."

  - name: "Second Generation (GMT900)"
    start_year: 2007
    end_year: 2014
    description: "The redesigned Silverado featured more aerodynamic styling, improved structural rigidity, and enhanced powertrains for better efficiency and capability. Engine options were updated with technologies like Active Fuel Management cylinder deactivation, while maintaining the range of V6 and V8 options. The interior saw significant improvements in design, material quality, and technology features. New variants included luxury-oriented High Country models and off-road-focused Z71 packages. This generation continued to solidify the Silverado's position as one of the top-selling vehicles in North America, with commercial and personal-use buyers equally important to its success."

  - name: "Third Generation (K2XX)"
    start_year: 2014
    end_year: 2015
    description: "The third-generation Silverado featured more distinctive styling with squared-off fenders and a bold front fascia. Extensive use of high-strength steel and aluminum components reduced weight while increasing capability. Engine options expanded to include more efficient small-block V8s and a 4.3L V6 sharing architecture with the V8 engines. The interior offered improved technology with the introduction of the MyLink infotainment system and enhanced connectivity features. This initial generation provided the foundation for the K2XX platform, offering various cab and bed configurations with strong sales and brand loyalty."

  - name: "Third Generation (K2XX) 2016 Facelift"
    start_year: 2016
    end_year: 2019
    description: "For 2016, the Silverado received a significant mid-cycle refresh with a new grille, headlights, and front fascia influenced by the Colorado design. LED taillights became available on higher trims (LTZ, High Country). Additional technology enhancements included HD Radio integration and Apple CarPlay/Android Auto capability on 8-inch touchscreen models. Truck ordered with bucket seats and center console received a wireless charging pad. Special editions proliferated throughout this period, offering various appearance and functional packages to appeal to different truck buyer segments. This generation faced increased competition from redesigned Ford and Ram trucks but maintained strong sales and brand loyalty."

  - name: "Fourth Generation (T1XX)"
    start_year: 2019
    end_year: 2021
    description: "The fourth-generation Silverado introduced a complete redesign with a new T1XX platform, unveiled on December 16, 2017, and released for the 2019 model year. Despite being larger than its predecessor, it employed mixed-material construction to reduce weight. Engine options expanded significantly to include a 2.7L turbocharged four-cylinder, 3.0L Duramax diesel inline-six, and updated V6 and V8 options. The interior received next-generation technology with touchscreen infotainment featuring Apple CarPlay and Android Auto. Capability increased with improved towing and payload capacities, including an industry-first VIN-specific trailering and payload label. The truck was praised for its comprehensive configuration options serving diverse truck buyers, from work-focused base models to near-luxury High Country variants."

  - name: "Fourth Generation (T1XX) 2022 Facelift"
    start_year: 2022
    end_year: null
    description: "For 2022, the Silverado received a comprehensive mid-cycle refresh with a new front-end design and revised interior. Notable additions included new trim levels (ZR2 for Silverado, AT4X and Denali Ultimate for Sierra), a completely redesigned dashboard for higher trims featuring larger 13.4-inch touchscreen displays with improved materials, and wireless Apple CarPlay and Android Auto capability. All trucks with front bucket seats received a new center console-mounted transmission shift lever. The 3.0L Duramax turbocharged diesel engine gained expanded availability across more trim levels. Additional features included General Motors Super Cruise semi-autonomous driving system on top-tier models and expanded standard safety equipment across the lineup. The ZR2 became the most off-road capable model, while top-tier variants received premium audio systems with subwoofers and metal speaker grilles."
